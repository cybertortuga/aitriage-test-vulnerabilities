name: AITriage Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AITriage Scanner (Terminal Log)
        uses: cybertortuga/aitriage@v1
        with:
          fail-on: never
          format: terminal

      - name: Generate HTML Security Report
        uses: cybertortuga/aitriage@v1
        with:
          fail-on: never
          format: html
          output-file: report.html

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aitriage-security-report
          path: report.html
