name: AITriage Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AITriage Scanner (Terminal Log & Annotations)
        uses: cybertortuga/aitriage@v1
        with:
          fail-on: never
          format: terminal

      - name: Generate HTML Security Report
        uses: cybertortuga/aitriage@v1
        with:
          fail-on: never
          format: html
          output-file: report.html

      - name: Run AITriage AI Agent (Triage & Fix Prompt)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: cybertortuga/aitriage@v1
        with:
          command: 'agent'
          args: '--no-chat --report-out report.md --fixspec-out fixspec.md'

      - name: Publish AI Triage Report & Fix Specs to GitHub Summary
        if: always()
        run: |
          if [ -f report.md ]; then
            echo "### 🛡️ AITriage AI Audit Report" >> $GITHUB_STEP_SUMMARY
            cat report.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f fixspec.md ]; then
            echo "### 🛠️ AI IDE Fix Prompt" >> $GITHUB_STEP_SUMMARY
            echo '```markdown' >> $GITHUB_STEP_SUMMARY
            cat fixspec.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aitriage-security-report
          path: report.html

